services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qualifai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides .env for local dev — points to the mongo container below
      - MONGO_URI=mongodb://mongo:27017/qualifai
      - ENVIRONMENT=development
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/app

  mongo:
    image: mongo:7.0
    container_name: qualifai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data: