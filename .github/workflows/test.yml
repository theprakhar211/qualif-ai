name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest ruff mypy
      - name: Lint
        run: cd backend && ruff check .
      - name: Type check
        run: cd backend && mypy services/ --ignore-missing-imports
      - name: Test
        run: cd backend && pytest